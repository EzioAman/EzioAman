<svg
  xmlns="http://www.w3.org/2000/svg"
  width="900"
  height="430"
  viewBox="0 0 900 430"
>

<defs>

  <!-- Background -->
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#03070c"/>
    <stop offset="55%" stop-color="#07101a"/>
    <stop offset="100%" stop-color="#0b1422"/>
  </linearGradient>

  <!-- Main neon -->
  <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#00d9ff"/>
    <stop offset="48%" stop-color="#6366f1"/>
    <stop offset="100%" stop-color="#b026ff"/>
  </linearGradient>

  <!-- Blue-purple -->
  <linearGradient id="bluePurple" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#00d9ff"/>
    <stop offset="100%" stop-color="#9b5cff"/>
  </linearGradient>

  <!-- Hair glow gradient: cyan -> violet -> pink, ties the "anime AI girl" theme together -->
  <linearGradient id="hairGlow" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#00e5ff"/>
    <stop offset="55%" stop-color="#9b5cff"/>
    <stop offset="100%" stop-color="#ff6ec7"/>
  </linearGradient>

  <!-- Glow -->
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="5" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="2"/>
  </filter>

  <filter id="hairGlowFilter" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="2.2"/>
  </filter>

  <radialGradient id="auraGrad" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#9b5cff" stop-opacity="0.32"/>
    <stop offset="60%" stop-color="#00d9ff" stop-opacity="0.11"/>
    <stop offset="100%" stop-color="#00d9ff" stop-opacity="0"/>
  </radialGradient>

</defs>


<!-- ========================================================= -->
<!-- BACKGROUND -->
<!-- ========================================================= -->

<rect
  x="1"
  y="1"
  width="898"
  height="428"
  rx="18"
  fill="url(#bg)"
  stroke="#293342"
  stroke-width="1.5"
/>


