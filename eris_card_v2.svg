<!-- ========================================================= -->
<!-- ERIS — vector anime-AI girl avatar -->
<!-- Everything below is centered on (485, 200) to match the -->
<!-- aura rings, fixing the earlier off-center glow issue.    -->
<!-- ========================================================= -->

<g>

  <!-- Whole-character float -->
  <animateTransform
    attributeName="transform"
    type="translate"
    values="0 0; 0 -7; 0 0"
    dur="4.4s"
    repeatCount="indefinite"
  />

  <!-- Aura glow, centered exactly on the head (485, 200) -->
  <circle cx="485" cy="205" r="150" fill="url(#auraGrad)">
    <animate attributeName="r" values="140;158;140" dur="4.4s" repeatCount="indefinite"/>
  </circle>

  <circle cx="485" cy="205" r="118" fill="none" stroke="#007cff" stroke-width="1" opacity="0.12">
    <animateTransform attributeName="transform" type="rotate" from="0 485 205" to="360 485 205" dur="38s" repeatCount="indefinite"/>
  </circle>

  <circle cx="485" cy="205" r="98" fill="none" stroke="#634cff" stroke-width="1" opacity="0.15">
    <animateTransform attributeName="transform" type="rotate" from="360 485 205" to="0 485 205" dur="28s" repeatCount="indefinite"/>
  </circle>

  <circle cx="485" cy="205" r="80" fill="none" stroke="#00d9ff" stroke-width="1" opacity="0.13">
    <animateTransform attributeName="transform" type="rotate" from="0 485 205" to="360 485 205" dur="22s" repeatCount="indefinite"/>
  </circle>


  <!-- Ground shadow -->
  <ellipse cx="485" cy="368" rx="82" ry="11" fill="#000" opacity="0.35">
    <animate attributeName="rx" values="82;70;82" dur="4.4s" repeatCount="indefinite"/>
  </ellipse>


  <!-- ===================== BACK HAIR (behind body, longest strands) ===================== -->
  <g stroke="url(#hairGlow)" stroke-width="3" stroke-linecap="round" fill="none" filter="url(#hairGlowFilter)" opacity="0.85">

    <g>
      <path d="M455 145 C420 200 415 300 440 400"/>
      <animateTransform attributeName="transform" type="rotate" values="-3 455 145; 3 455 145; -3 455 145" dur="5.2s" repeatCount="indefinite"/>
    </g>

    <g>
      <path d="M515 145 C550 200 555 300 530 400"/>
      <animateTransform attributeName="transform" type="rotate" values="3 515 145; -3 515 145; 3 515 145" dur="4.8s" begin=".3s" repeatCount="indefinite"/>
    </g>

    <g>
      <path d="M485 138 C480 210 490 300 485 405"/>
      <animateTransform attributeName="transform" type="rotate" values="-2 485 138; 2 485 138; -2 485 138" dur="5.6s" begin=".6s" repeatCount="indefinite"/>
    </g>

  </g>


  <!-- ===================== SIDE STRANDS (flowing past shoulders) ===================== -->
  <g stroke="url(#hairGlow)" stroke-width="2.6" stroke-linecap="round" fill="none" filter="url(#hairGlowFilter)" opacity="0.9">

    <g>
      <path d="M418 165 C385 205 375 270 392 335 C400 362 392 378 385 390"/>
      <animateTransform attributeName="transform" type="rotate" values="-4 418 165; 4 418 165; -4 418 165" dur="3.6s" repeatCount="indefinite"/>
    </g>

    <g>
      <path d="M552 165 C585 205 595 270 578 335 C570 362 578 378 585 390"/>
      <animateTransform attributeName="transform" type="rotate" values="4 552 165; -4 552 165; 4 552 165" dur="3.9s" begin=".4s" repeatCount="indefinite"/>
    </g>

    <g>
      <path d="M425 195 C400 235 398 280 412 320"/>
      <animateTransform attributeName="transform" type="rotate" values="-3 425 195; 3 425 195; -3 425 195" dur="3.2s" begin=".8s" repeatCount="indefinite"/>
    </g>

    <g>
      <path d="M545 195 C570 235 572 280 558 320"/>
      <animateTransform attributeName="transform" type="rotate" values="3 545 195; -3 545 195; 3 545 195" dur="3.4s" begin="1.1s" repeatCount="indefinite"/>
    </g>

  </g>


  <!-- ===================== HEAD ===================== -->

  <!-- Small glowing hair-clip / antenna light — nods to the old status LED -->
  <circle cx="485" cy="126" r="4" fill="#00e5ff" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0.35;1" dur="2.1s" repeatCount="indefinite"/>
  </circle>
  <line x1="485" y1="130" x2="485" y2="140" stroke="#00e5ff" stroke-width="1.5" opacity="0.6"/>

  <rect
    x="415" y="135" width="140" height="130" rx="46"
    fill="#050a11" stroke="url(#neon)" stroke-width="3.5"
    filter="url(#glow)"
  />

  <!-- Ears -->
  <ellipse cx="413" cy="205" rx="7" ry="12" fill="#050a11" stroke="url(#neon)" stroke-width="2"/>
  <ellipse cx="557" cy="205" rx="7" ry="12" fill="#050a11" stroke="url(#neon)" stroke-width="2"/>

  <!-- Blush -->
  <ellipse cx="437" cy="228" rx="11" ry="6" fill="#ff8fd6" opacity="0.55"/>
  <ellipse cx="533" cy="228" rx="11" ry="6" fill="#ff8fd6" opacity="0.55"/>

  <!-- Eyebrows -->
  <path d="M438 178 Q452 172 466 178" fill="none" stroke="#a9b8cc" stroke-width="2" stroke-linecap="round"/>
  <path d="M504 178 Q518 172 532 178" fill="none" stroke="#a9b8cc" stroke-width="2" stroke-linecap="round"/>

  <!-- Normal eyes: open + periodic blink -->
  <g>
    <ellipse cx="452" cy="206" rx="13" ry="16" fill="#00e5ff" filter="url(#glow)">
      <animate attributeName="ry" values="16;16;2;16;16" keyTimes="0;0.86;0.9;0.94;1" dur="5.5s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="518" cy="206" rx="13" ry="16" fill="#00e5ff" filter="url(#glow)">
      <animate attributeName="ry" values="16;16;2;16;16" keyTimes="0;0.86;0.9;0.94;1" dur="5.5s" repeatCount="indefinite"/>
    </ellipse>
    <circle cx="447" cy="200" r="3" fill="#eafcff"/>
    <circle cx="513" cy="200" r="3" fill="#eafcff"/>

    <!-- fade this whole normal-eyes group out during the "happy" expression window -->
    <animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.72;0.78;0.88;0.94;1" dur="11s" repeatCount="indefinite"/>
  </g>

  <!-- Happy (^ ^) eyes: cross-fades in periodically for an expression change -->
  <g opacity="0" stroke="#00e5ff" stroke-width="3" stroke-linecap="round" fill="none" filter="url(#glow)">
    <path d="M438 208 Q452 196 466 208"/>
    <path d="M504 208 Q518 196 532 208"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.72;0.78;0.88;0.94;1" dur="11s" repeatCount="indefinite"/>
  </g>

  <!-- Mouth — gentle idle talking wiggle -->
  <path d="M472 240 Q485 247 498 240" fill="none" stroke="#ff9fd6" stroke-width="3" stroke-linecap="round">
    <animate
      attributeName="d"
      values="
        M472 240 Q485 247 498 240;
        M472 240 Q485 252 498 240;
        M472 240 Q485 240 498 240;
        M472 240 Q485 247 498 240"
      dur="2.6s"
      repeatCount="indefinite"
    />
  </path>


  <!-- ===================== FRONT BANGS (over forehead, in front of head shape) ===================== -->
  <g stroke="url(#hairGlow)" stroke-width="2.4" stroke-linecap="round" fill="none" filter="url(#hairGlowFilter)" opacity="0.95">

    <g>
      <path d="M485 132 C462 140 448 165 452 190"/>
      <animateTransform attributeName="transform" type="rotate" values="-2 485 132; 2 485 132; -2 485 132" dur="3.1s" repeatCount="indefinite"/>
    </g>

    <g>
      <path d="M485 132 C508 140 522 165 518 190"/>
      <animateTransform attributeName="transform" type="rotate" values="2 485 132; -2 485 132; 2 485 132" dur="3.3s" begin=".2s" repeatCount="indefinite"/>
    </g>

    <g>
      <path d="M462 135 C450 148 445 162 449 175"/>
      <animateTransform attributeName="transform" type="rotate" values="-3 462 135; 3 462 135; -3 462 135" dur="2.8s" begin=".5s" repeatCount="indefinite"/>
    </g>

  </g>


  <!-- ===================== SHOULDERS / TORSO ===================== -->

  <ellipse cx="432" cy="308" rx="16" ry="30" fill="#07101a" stroke="#4254d8" stroke-width="2"/>
  <ellipse cx="538" cy="308" rx="16" ry="30" fill="#07101a" stroke="#4254d8" stroke-width="2"/>

  <rect x="448" y="270" width="74" height="90" rx="28" fill="#050b13" stroke="url(#neon)" stroke-width="3" filter="url(#glow)"/>

  <!-- Collar / bow accent -->
  <path d="M460 270 L485 296 L510 270" fill="none" stroke="#a66cff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M468 305 L485 297 L502 305 L485 313 Z" fill="#0b1422" stroke="#ff6ec7" stroke-width="1.6" stroke-linejoin="round"/>
  <circle cx="485" cy="305" r="3" fill="#ff6ec7"/>

  <!-- AI core, pulsing -->
  <circle cx="485" cy="325" r="20" fill="#050a11" stroke="url(#neon)" stroke-width="3" filter="url(#glow)"/>
  <circle cx="485" cy="325" r="7" fill="#00cfff">
    <animate attributeName="r" values="6;10;6" dur="1.6s" repeatCount="indefinite"/>
  </circle>

</g>


