  <circle cx="220" cy="32" r="1.2"/>
  <circle cx="315" cy="60" r="1"/>
  <circle cx="370" cy="25" r="1"/>
  <circle cx="430" cy="55" r="1.2"/>
  <circle cx="495" cy="35" r="1"/>
