<svg
  width="900"
  height="430"
  viewBox="0 0 900 430"
  xmlns="http://www.w3.org/2000/svg"
>

<defs>

  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#080b10"/>
    <stop offset="100%" stop-color="#101827"/>
  </linearGradient>

  <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#60a5fa"/>
    <stop offset="50%" stop-color="#8b5cf6"/>
    <stop offset="100%" stop-color="#22d3ee"/>
  </linearGradient>

  <filter id="glow">
    <feGaussianBlur stdDeviation="6" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <filter id="softGlow">
    <feGaussianBlur stdDeviation="2"/>
  </filter>

</defs>


<!-- BACKGROUND -->

<rect
  width="900"
  height="430"
  rx="24"
  fill="url(#bg)"
/>


<!-- SUBTLE GRID -->

<g opacity="0.05" stroke="#60a5fa">

  <path d="M0 80H900"/>
  <path d="M0 160H900"/>
  <path d="M0 240H900"/>
  <path d="M0 320H900"/>

  <path d="M100 0V430"/>
  <path d="M200 0V430"/>
  <path d="M300 0V430"/>
  <path d="M400 0V430"/>
  <path d="M500 0V430"/>
  <path d="M600 0V430"/>
  <path d="M700 0V430"/>
  <path d="M800 0V430"/>

</g>


<!-- TOP LEFT -->

<text
  x="55"
  y="55"
  fill="#64748b"
  font-family="monospace"
  font-size="12"
>
  &gt; WHOAMI
</text>

<text
  x="55"
