<!-- ERIS ROBOT -->

<g transform="translate(690 205)">

  <animateTransform
    attributeName="transform"
    type="translate"
    values="690 205;690 193;690 205"
    dur="4s"
    repeatCount="indefinite"
  />

  <!-- aura -->

  <circle
    r="105"
    fill="none"
    stroke="url(#neon)"
    stroke-width="1"
    opacity="0.15"
  >
    <animate
      attributeName="r"
      values="85;115;85"
      dur="4s"
      repeatCount="indefinite"
    />
  </circle>


  <!-- head -->

  <rect
    x="-70"
    y="-70"
    width="140"
    height="110"
    rx="35"
    fill="#0c111a"
    stroke="url(#neon)"
    stroke-width="3"
    filter="url(#glow)"
  />


  <!-- ears -->

  <path
    d="M-55-60 L-82-95 L-30-72"
    fill="#0c111a"
    stroke="#60a5fa"
    stroke-width="3"
  />

  <path
    d="M55-60 L82-95 L30-72"
    fill="#0c111a"
    stroke="#60a5fa"
    stroke-width="3"
  />


  <!-- eyes -->

  <ellipse
    cx="-30"
    cy="-18"
    rx="14"
    ry="19"
    fill="#60a5fa"
    filter="url(#glow)"
  >
    <animate
      attributeName="ry"
      values="19;3;19"
      dur="4s"
      repeatCount="indefinite"
    />
  </ellipse>

  <ellipse
    cx="30"
    cy="-18"
    rx="14"
    ry="19"
    fill="#60a5fa"
    filter="url(#glow)"
  >
    <animate
      attributeName="ry"
      values="19;3;19"
      dur="4s"
      repeatCount="indefinite"
    />
  </ellipse>


  <!-- face -->

  <path
    d="M-9 8 Q0 17 9 8"
    fill="none"
    stroke="#a78bfa"
    stroke-width="3"
    stroke-linecap="round"
  />


  <!-- core -->

  <circle
    cx="0"
    cy="65"
    r="15"
    fill="#080b10"
    stroke="url(#neon)"
    stroke-width="3"
    filter="url(#glow)"
  />

  <circle
    cx="0"
    cy="65"
    r="5"
    fill="#60a5fa"
  >
    <animate
      attributeName="r"
      values="4;8;4"
      dur="1.5s"
      repeatCount="indefinite"
    />
  </circle>

</g>


