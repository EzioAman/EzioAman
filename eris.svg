<svg
  width="900"
  height="360"
  viewBox="0 0 900 360"
  xmlns="http://www.w3.org/2000/svg"
>

  <defs>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="smallGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>

  <!-- Background -->

  <rect
    width="900"
    height="360"
    rx="20"
    fill="url(#bg)"
  />

  <!-- Stars -->

  <g fill="#60a5fa" opacity="0.7">

    <circle cx="80" cy="70" r="2">
      <animate
        attributeName="opacity"
        values="0.2;1;0.2"
        dur="2.5s"
        repeatCount="indefinite"
      />
    </circle>

    <circle cx="180" cy="120" r="1.5">
      <animate
        attributeName="opacity"
        values="1;0.2;1"
        dur="3s"
        repeatCount="indefinite"
      />
    </circle>

    <circle cx="740" cy="80" r="2">
      <animate
        attributeName="opacity"
        values="0.2;1;0.2"
        dur="2s"
        repeatCount="indefinite"
      />
    </circle>

    <circle cx="820" cy="160" r="1.5">
      <animate
        attributeName="opacity"
        values="1;0.2;1"
        dur="3.5s"
        repeatCount="indefinite"
      />
    </circle>

  </g>

  <!-- Header -->

  <text
    x="60"
    y="70"
    fill="#94a3b8"
    font-family="monospace"
    font-size="14"
  >
    &gt; SYSTEM INITIALIZING
  </text>

  <text
    x="60"
    y="120"
    fill="white"
    font-family="monospace"
    font-size="42"
    font-weight="bold"
  >
    ERIS
  </text>

  <text
    x="60"
    y="150"
    fill="#64748b"
    font-family="monospace"
    font-size="15"
  >
    AGENTIC AI SYSTEM
  </text>

  <!-- Status -->

  <circle
    cx="65"
    cy="190"
    r="5"
    fill="#22c55e"
    filter="url(#smallGlow)"
  >
    <animate
      attributeName="opacity"
      values="1;0.3;1"
      dur="1.5s"
      repeatCount="indefinite"
    />
  </circle>

  <text
    x="80"
    y="195"
    fill="#22c55e"
    font-family="monospace"
    font-size="13"
  >
    ONLINE · IN DEVELOPMENT
  </text>

  <!-- System flow -->

  <text
    x="60"
    y="245"
    fill="#cbd5e1"
    font-family="monospace"
    font-size="13"
  >
    THINK
  </text>

  <text
    x="130"
    y="245"
    fill="#475569"
    font-family="monospace"
    font-size="13"
  >
    →
  </text>

  <text
    x="160"
    y="245"
    fill="#cbd5e1"
    font-family="monospace"
    font-size="13"
  >
    PLAN
  </text>

  <text
    x="230"
    y="245"
    fill="#475569"
    font-family="monospace"
    font-size="13"
  >
    →
  </text>

  <text
    x="260"
    y="245"
    fill="#cbd5e1"
    font-family="monospace"
    font-size="13"
  >
    ACT
  </text>

  <text
    x="310"
    y="245"
    fill="#475569"
    font-family="monospace"
    font-size="13"
  >
    →
  </text>

  <text
    x="340"
    y="245"
    fill="#cbd5e1"
    font-family="monospace"
    font-size="13"
  >
    REMEMBER
  </text>

  <!-- Robot -->

  <g transform="translate(640 170)">

    <!-- Floating animation -->

    <animateTransform
      attributeName="transform"
      type="translate"
      values="640 170;640 155;640 170"
      dur="4s"
      repeatCount="indefinite"
    />

    <!-- Aura -->

    <circle
      cx="0"
      cy="0"
      r="90"
      fill="none"
      stroke="url(#core)"
      stroke-width="1"
      opacity="0.25"
    >
      <animate
        attributeName="r"
        values="75;105;75"
        dur="3s"
        repeatCount="indefinite"
      />

      <animate
        attributeName="opacity"
        values="0.3;0.05;0.3"
        dur="3s"
        repeatCount="indefinite"
      />
    </circle>

    <!-- Head -->

    <rect
      x="-65"
      y="-60"
      width="130"
      height="105"
      rx="35"
      fill="#111827"
      stroke="url(#core)"
      stroke-width="3"
      filter="url(#glow)"
    />

    <!-- Ears -->

    <path
      d="M-55-50 L-80-85 L-30-65 Z"
      fill="#111827"
      stroke="#60a5fa"
      stroke-width="3"
    />

    <path
      d="M55-50 L80-85 L30-65 Z"
      fill="#111827"
      stroke="#60a5fa"
      stroke-width="3"
    />

    <!-- Eyes -->

    <ellipse
      cx="-28"
      cy="-10"
      rx="13"
      ry="18"
      fill="#60a5fa"
      filter="url(#glow)"
    >
      <animate
        attributeName="ry"
        values="18;3;18"
        dur="4s"
        repeatCount="indefinite"
      />
    </ellipse>

    <ellipse
      cx="28"
      cy="-10"
      rx="13"
      ry="18"
      fill="#60a5fa"
      filter="url(#glow)"
    >
      <animate
        attributeName="ry"
        values="18;3;18"
        dur="4s"
        repeatCount="indefinite"
      />
    </ellipse>

    <!-- Face -->

    <path
      d="M-8 15 Q0 22 8 15"
      fill="none"
      stroke="#a78bfa"
      stroke-width="3"
      stroke-linecap="round"
    />

    <!-- Core -->

    <circle
      cx="0"
      cy="70"
      r="14"
      fill="none"
      stroke="url(#core)"
      stroke-width="3"
      filter="url(#glow)"
    />

    <circle
      cx="0"
      cy="70"
      r="5"
      fill="#60a5fa"
    >
      <animate
        attributeName="r"
        values="4;8;4"
        dur="1.5s"
        repeatCount="indefinite"
      />
    </circle>

  </g>

  <!-- Footer -->

  <text
    x="60"
    y="315"
    fill="#475569"
    font-family="monospace"
    font-size="12"
  >
    MEMORY · TOOLS · REASONING · AUTONOMY
  </text>

</svg>
